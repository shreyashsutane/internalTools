<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool 3 - Under Development</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0c1117;
            --bg-card: #131b26;
            --border-color: #1e2d3d;
            --text-main: #e2e8f0;
            --text-muted: #5a6f87;
            --dista-orange: #f7941d;
            --dista-orange-dark: #e85d04;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .coming-soon-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            font-size: 4rem;
            color: var(--dista-orange);
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .btn-home {
            background: var(--dista-orange);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-home:hover {
            background: var(--dista-orange-dark);
            color: white;
            transform: translateY(-2px);
        }
    </style>
<base target="_self">
</head>
<body>
    <div class="coming-soon-card">
        <div class="icon-box">
            <i class="bi bi-cone-striped"></i>
        </div>
        <h1>Tool 3 is Coming Soon</h1>
        <p>
            This operational data management tool is under construction. 
            Stay tuned as we continue building utilities to streamline your workflow.
        </p>
        <a href="/" class="btn-home"><i class="bi bi-house-door me-2"></i>Back to Home</a>
    </div>
</body>
</html>
