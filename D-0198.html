<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreyash Easter Egg — Standalone Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;950&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #06060c;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* EASTER EGG CONTAINER */
        .shreyash-easter-egg {
            position: fixed;
            inset: 0;
            z-index: 100;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
        }

        /* NOISE & SCANLINES */
        .ee-noise {
            position: absolute;
            inset: -30%;
            z-index: 30;
            pointer-events: none;
            opacity: 0.16;
            background-image: repeating-radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.35) 0 1px, transparent 1px 3px);
            animation: noiseMove 0.08s steps(2) infinite;
            mix-blend-mode: screen;
        }

        @keyframes noiseMove {
            0% { transform: translate(0); }
            25% { transform: translate(2%, -1%); }
            50% { transform: translate(-1%, 2%); }
            75% { transform: translate(1%, 1%); }
            100% { transform: translate(-2%, -1%); }
        }

        .ee-scanlines {
            position: absolute;
            inset: 0;
            z-index: 31;
            pointer-events: none;
            opacity: 0.25;
            background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 2px 5px);
        }

        /* HORROR STAGE */
        .horror-stage {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 42%, rgba(120, 0, 0, 0.45), transparent 45%), linear-gradient(180deg, #0a0505 0%, #020202 100%);
            z-index: 10;
        }

        .horror-vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.98), inset 0 0 90px rgba(160, 0, 0, 0.35);
        }

        .horror-copy {
            position: relative;
            z-index: 15;
            width: min(920px, 90vw);
            text-align: center;
            color: #fff;
            animation: horrorShake 0.09s steps(2) infinite;
        }

        @keyframes horrorShake {
            0% { transform: translate(0); }
            25% { transform: translate(-3px, 1.5px) rotate(-0.3deg); }
            50% { transform: translate(3px, -1.5px) rotate(0.2deg); }
            75% { transform: translate(-1.5px, -3px) rotate(-0.15deg); }
            100% { transform: translate(1.5px, 3px) rotate(0.15deg); }
        }

        .hack-title {
            position: relative;
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(34px, 7vw, 92px);
            font-weight: 900;
            letter-spacing: 0.02em;
            line-height: 0.95;
            color: #f8f8f8;
            text-shadow: -6px 0 rgba(255, 0, 55, 0.8), 6px 0 rgba(0, 210, 255, 0.6), 0 0 25px rgba(255, 0, 45, 0.65);
            animation: glitchMain 0.13s steps(2) infinite;
        }

        .hack-title::before, .hack-title::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .hack-title::before {
            color: rgba(255, 40, 70, 0.9);
            clip-path: inset(5% 0 56% 0);
            transform: translateX(-5px);
            animation: glitchSliceA 0.2s steps(2) infinite;
        }

        .hack-title::after {
            color: rgba(80, 220, 255, 0.85);
            clip-path: inset(56% 0 10% 0);
            transform: translateX(5px);
            animation: glitchSliceB 0.16s steps(2) infinite;
        }

        @keyframes glitchMain {
            0%, 100% { transform: skewX(0); }
            45% { transform: skewX(-2.5deg); }
            60% { transform: skewX(2.5deg); }
        }

        @keyframes glitchSliceA {
            0% { transform: translate(-6px, 0); }
            50% { transform: translate(8px, -2px); }
            100% { transform: translate(-5px, 2px); }
        }

        @keyframes glitchSliceB {
            0% { transform: translate(6px, 0); }
            50% { transform: translate(-9px, 2px); }
            100% { transform: translate(5px, -2px); }
        }

        .hack-subtitle {
            margin: 22px 0 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(12px, 1.5vw, 17px);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .terminal-fragments {
            position: absolute;
            inset: -130px -5vw;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(255, 70, 90, 0.55);
            letter-spacing: 0.1em;
        }

        .terminal-fragments span {
            position: absolute;
            animation: terminalFlash 0.25s steps(2) infinite;
        }

        .terminal-fragments span:nth-child(1) { left: 4%; top: 8%; }
        .terminal-fragments span:nth-child(2) { right: 4%; top: 22%; }
        .terminal-fragments span:nth-child(3) { left: 10%; bottom: 16%; }
        .terminal-fragments span:nth-child(4) { right: 12%; bottom: 8%; }

        @keyframes terminalFlash {
            0%, 40% { opacity: 0.15; }
            50%, 80% { opacity: 0.9; }
            100% { opacity: 0.2; }
        }

        .horror-eyes {
            position: absolute;
            top: 14%;
            left: 50%;
            display: flex;
            gap: 50px;
            transform: translateX(-50%);
            opacity: 0.25;
        }

        .horror-eyes span {
            width: 44px;
            height: 14px;
            border-radius: 999px 999px 40% 40%;
            background: #ff304d;
            box-shadow: 0 0 24px rgba(255, 30, 60, 0.85);
        }

        /* CRT TRANSITION */
        .phase-crt .horror-stage {
            animation: crtOff 0.26s cubic-bezier(0.7, 0, 0.9, 0.4) forwards;
        }

        @keyframes crtOff {
            0% { transform: scale(1); filter: brightness(1); }
            55% { transform: scale(1, 0.035); filter: brightness(2.8); }
            100% { transform: scale(0, 0.02); filter: brightness(5); }
        }

        /* REVEAL STAGE */
        .reveal-stage {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 50% 45%, rgba(128, 94, 255, 0.18), transparent 40%), linear-gradient(180deg, #0d0a1a 0%, #07060e 100%);
            animation: revealBackground 0.45s ease-out both;
            z-index: 20;
        }

        @keyframes revealBackground {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        .reveal-card {
            position: relative;
            width: min(720px, 92vw);
            text-align: center;
            color: #fff;
            padding: 40px 20px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(140, 110, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(120, 90, 255, 0.15);
            backdrop-filter: blur(16px);
        }

        /* MASCOT ORB */
        .mascot-orb {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0 12%, #83f5ff 25%, #727cff 55%, #9b65ff 80%, #c78cff 100%);
            box-shadow: 0 14px 34px rgba(84, 79, 190, 0.4), 0 0 40px rgba(126, 112, 255, 0.5);
            animation: orbPop 0.55s cubic-bezier(0.2, 0.9, 0.2, 1.25) both, orbFloat 2.2s ease-in-out 0.55s infinite;
        }

        @keyframes orbPop {
            from { opacity: 0; transform: translateY(28px) scale(0.3) rotate(-18deg); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes orbFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
        }

        .orb-face {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .orb-eye {
            position: absolute;
            top: 40px;
            width: 12px;
            height: 8px;
            border: 3px solid #1a162b;
            border-top: 0;
            border-left: 0;
            border-right: 0;
            border-radius: 50%;
        }

        .orb-eye.left { left: 26px; transform: rotate(6deg); }
        .orb-eye.right { right: 26px; transform: rotate(-6deg); }

        .orb-smile {
            position: absolute;
            left: 50%;
            top: 55px;
            width: 26px;
            height: 12px;
            border-bottom: 3.5px solid #1a162b;
            border-radius: 0 0 50% 50%;
            transform: translateX(-50%);
        }

        .kidding-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: clamp(22px, 4.5vw, 42px);
            font-weight: 950;
            letter-spacing: 0.1em;
            color: #dcd6ff;
            text-shadow: 0 0 20px rgba(160, 130, 255, 0.4);
            animation: kiddingIn 0.55s ease-out 0.1s both;
        }

        @keyframes kiddingIn {
            from { opacity: 0; transform: translateY(14px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .kidding-star {
            font-size: 0.65em;
            color: #a38aff;
            animation: starPulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes starPulse {
            from { transform: scale(0.75) rotate(-12deg); opacity: 0.5; }
            to { transform: scale(1.3) rotate(12deg); opacity: 1; }
        }

        .prompted-label {
            margin-top: 24px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-weight: 700;
            color: rgba(220, 215, 255, 0.55);
            animation: softUp 0.5s ease-out 0.28s both;
        }

        .creator-name {
            position: relative;
            display: inline-block;
            margin-top: 6px;
            font-size: clamp(48px, 10vw, 104px);
            font-weight: 950;
            letter-spacing: -0.04em;
            line-height: 1;
            color: #00f0ff;
            background: linear-gradient(100deg, #ffffff 5%, #c5b8ff 40%, #7e6cff 75%, #00f0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 35px rgba(0, 240, 255, 0.6), 0 0 70px rgba(126, 108, 255, 0.4);
            animation: creatorIn 0.75s cubic-bezier(0.2, 0.9, 0.2, 1) 0.1s both;
        }

        @keyframes creatorIn {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .creator-underline {
            position: absolute;
            left: 2%;
            right: 2%;
            bottom: -12px;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, #7d68f6 20%, #00d4ff 50%, #a88cff 80%, transparent);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.6);
            transform-origin: left;
            animation: drawLine 0.72s ease-out 0.4s both;
        }

        @keyframes drawLine {
            from { transform: scaleX(0); opacity: 0; }
            to { transform: scaleX(1); opacity: 1; }
        }

        .creator-spark {
            position: absolute;
            right: 0;
            bottom: -22px;
            color: #00f0ff;
            font-size: 24px;
            text-shadow: 0 0 12px #00f0ff;
            animation: sparkTravel 0.72s ease-out 0.4s both;
        }

        @keyframes sparkTravel {
            from { right: 96%; opacity: 0; transform: scale(0.4) rotate(0); }
            30% { opacity: 1; }
            to { right: 0; opacity: 1; transform: scale(1.1) rotate(180deg); }
        }

        .help-line {
            margin-top: 36px;
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(220, 215, 255, 0.55);
            animation: softUp 0.55s ease-out 0.5s both;
        }

        .credits {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            font-weight: 800;
            font-size: clamp(16px, 2.6vw, 22px);
            color: #eae6ff;
            animation: softUp 0.55s ease-out 0.6s both;
        }

        .credit-x {
            color: #8c7aff;
            font-weight: 400;
        }

        @keyframes softUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal-spark {
            position: absolute;
            color: #bfaaff;
            opacity: 0;
            animation: sparkleBurst 1.6s ease-in-out infinite;
        }

        .spark-one { left: 16%; top: 26%; font-size: 32px; animation-delay: 0.1s; }
        .spark-two { right: 15%; top: 35%; font-size: 26px; animation-delay: 0.5s; }
        .spark-three { left: 24%; bottom: 20%; font-size: 20px; animation-delay: 0.85s; }

        @keyframes sparkleBurst {
            0% { opacity: 0; transform: scale(0.4); }
            35% { opacity: 1; transform: scale(1.3) rotate(25deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(90deg) translateY(-16px); }
        }

        /* FLOATING INTERACTIVE CONTROLS BAR */
        .controls-bar {
            position: fixed;
            bottom: 24px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(18, 16, 28, 0.85);
            border: 1px solid rgba(140, 110, 255, 0.35);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(120, 90, 255, 0.2);
            backdrop-filter: blur(20px);
        }

        .btn-ctrl {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover {
            background: rgba(140, 110, 255, 0.25);
            border-color: rgba(140, 110, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-ctrl.btn-primary {
            background: linear-gradient(135deg, #6e56ff, #00d4ff);
            border: none;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
        }

        .btn-ctrl.btn-primary:hover {
            box-shadow: 0 6px 24px rgba(0, 212, 255, 0.5);
            transform: translateY(-2px) scale(1.02);
        }
    </style>
</head>
<body>

    <!-- STANDALONE EASTER EGG CONTAINER -->
    <div id="easter-egg-root" class="shreyash-easter-egg phase-horror" role="dialog" aria-modal="true">
        <div class="ee-noise" aria-hidden="true"></div>
        <div class="ee-scanlines" aria-hidden="true"></div>

        <!-- HORROR GLITCH STAGE -->
        <div id="stage-horror" class="horror-stage">
            <div class="horror-vignette" aria-hidden="true"></div>
            <div class="horror-eyes" aria-hidden="true"><span></span><span></span></div>
            <div class="horror-copy">
                <div class="terminal-fragments" aria-hidden="true">
                    <span>CRITICAL_SYSTEM_FAIL</span>
                    <span>MEM_CORRUPT_0x8F9</span>
                    <span>REMOTE_DUMP_ACTIVE</span>
                    <span>ROOT_ACCESS_EXPOSED</span>
                </div>
                <h1 class="hack-title" data-text="YOUR PC HAS BEEN HACKED">
                    YOUR PC HAS BEEN HACKED
                </h1>
            </div>
        </div>

        <!-- REVEAL HERO STAGE -->
        <div id="stage-reveal" class="reveal-stage" style="display:none;">
            <div class="reveal-spark spark-one" aria-hidden="true">✦</div>
            <div class="reveal-spark spark-two" aria-hidden="true">✧</div>
            <div class="reveal-spark spark-three" aria-hidden="true">✦</div>

            <div class="reveal-card">
                <div class="mascot-orb" aria-hidden="true">
                    <div class="orb-face">
                        <span class="orb-eye left"></span>
                        <span class="orb-eye right"></span>
                        <span class="orb-smile"></span>
                    </div>
                </div>

                <div class="kidding-row">
                    <span class="kidding-star">✦</span>
                    <span>JUST KIDDING</span>
                    <span class="kidding-star">✦</span>
                </div>

                <div class="prompted-label">Prompted by</div>
                <div class="creator-name">
                    D-0198
                    <span class="creator-underline" aria-hidden="true"></span>
                    <span class="creator-spark" aria-hidden="true">✦</span>
                </div>

                <div class="help-line">with help from</div>
                <div class="credits">
                    <span>Antigravity 2.0</span>
                    <span class="credit-x">×</span>
                    <span>GPT-5.6 Sol</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING CONTROLS -->
    <div class="controls-bar">
        <button id="btn-replay" class="btn-ctrl btn-primary">
            <i class="fa-solid fa-rotate-right"></i> Replay Animation
        </button>
        <button id="btn-sound" class="btn-ctrl">
            <i class="fa-solid fa-volume-high"></i> Sound: ON
        </button>
        <button id="btn-hold" class="btn-ctrl">
            <i class="fa-solid fa-pause"></i> Hold View
        </button>
    </div>

    <script>
        // Web Audio Synthesizer for Glitch & Kawaii Chime
        class EasterAudio {
            static ctx = null;
            static soundEnabled = true;

            static getCtx() {
                if (!EasterAudio.soundEnabled) return null;
                if (!EasterAudio.ctx) {
                    EasterAudio.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (EasterAudio.ctx && EasterAudio.ctx.state === 'suspended') {
                    EasterAudio.ctx.resume();
                }
                return EasterAudio.ctx;
            }

            static playGlitch(durationMs = 5000) {
                const ctx = EasterAudio.getCtx();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;
                    // Low pulsing cyber drone
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(55, now + (durationMs / 1000));

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (durationMs / 1000));

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + (durationMs / 1000));

                    // Random glitch clicks during the 5 seconds
                    const numBeeps = Math.floor(durationMs / 600);
                    for (let i = 0; i < numBeeps; i++) {
                        const beepTime = now + (i * 0.6) + (Math.random() * 0.2);
                        const bOsc = ctx.createOscillator();
                        const bGain = ctx.createGain();
                        bOsc.type = 'square';
                        bOsc.frequency.setValueAtTime(200 + Math.random() * 400, beepTime);
                        bGain.gain.setValueAtTime(0.06, beepTime);
                        bGain.gain.exponentialRampToValueAtTime(0.0001, beepTime + 0.12);
                        bOsc.connect(bGain);
                        bGain.connect(ctx.destination);
                        bOsc.start(beepTime);
                        bOsc.stop(beepTime + 0.12);
                    }
                } catch(e) {}
            }

            static playChime() {
                const ctx = EasterAudio.getCtx();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime;
                    const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const t = now + (i * 0.08);

                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, t);

                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start(t);
                        osc.stop(t + 0.4);
                    });
                } catch(e) {}
            }
        }

        // Animation Phase Orchestrator
        let currentTimer = null;
        let isHolding = false;

        function runAnimation(horrorMs = 10000) {
            if (currentTimer) clearTimeout(currentTimer);
            
            const root = document.getElementById('easter-egg-root');
            const stageHorror = document.getElementById('stage-horror');
            const stageReveal = document.getElementById('stage-reveal');

            // Phase 1: Horror (10 full seconds)
            root.className = 'shreyash-easter-egg phase-horror';
            stageHorror.style.display = 'grid';
            stageReveal.style.display = 'none';
            EasterAudio.playGlitch(horrorMs);

            // Phase 2: CRT Off
            currentTimer = setTimeout(() => {
                root.className = 'shreyash-easter-egg phase-crt';

                // Phase 3: Reveal
                currentTimer = setTimeout(() => {
                    root.className = 'shreyash-easter-egg phase-reveal';
                    stageHorror.style.display = 'none';
                    stageReveal.style.display = 'grid';
                    stageReveal.classList.remove('reveal-stage-anim');
                    void stageReveal.offsetWidth; // force reflow
                    stageReveal.classList.add('reveal-stage-anim');
                    EasterAudio.playChime();
                }, 280);

            }, horrorMs);
        }

        // Event Listeners
        document.getElementById('btn-replay').onclick = () => {
            isHolding = false;
            document.getElementById('btn-hold').innerHTML = '<i class="fa-solid fa-pause"></i> Hold View';
            runAnimation(10000);
        };

        const soundBtn = document.getElementById('btn-sound');
        soundBtn.onclick = () => {
            EasterAudio.soundEnabled = !EasterAudio.soundEnabled;
            soundBtn.innerHTML = EasterAudio.soundEnabled 
                ? '<i class="fa-solid fa-volume-high"></i> Sound: ON' 
                : '<i class="fa-solid fa-volume-xmark"></i> Sound: OFF';
        };

        const holdBtn = document.getElementById('btn-hold');
        holdBtn.onclick = () => {
            const stageHorror = document.getElementById('stage-horror');
            const stageReveal = document.getElementById('stage-reveal');
            const root = document.getElementById('easter-egg-root');
            
            isHolding = !isHolding;
            if (isHolding) {
                if (currentTimer) clearTimeout(currentTimer);
                root.className = 'shreyash-easter-egg phase-reveal';
                stageHorror.style.display = 'none';
                stageReveal.style.display = 'grid';
                holdBtn.innerHTML = '<i class="fa-solid fa-play"></i> Resume Cycle';
            } else {
                holdBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Hold View';
                runAnimation(10000);
            }
        };

        // Start automatically on page load (10 seconds hacked horror animation)
        window.addEventListener('load', () => {
            runAnimation(10000);
        });
    </script>
</body>
</html>
