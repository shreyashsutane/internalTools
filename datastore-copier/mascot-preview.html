<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assist Mascot Showcase | Happy & Angry States</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.8);
            --border: rgba(0, 212, 255, 0.25);
            --accent-teal: #00d4ff;
            --accent-purple: #c084fc;
            --accent-green: #34d399;
            --accent-amber: #fbbf24;
            --accent-pink: #ff6090;
            --accent-red: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 212, 255, 0.09) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.07) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        .showcase-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 44px 36px;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 212, 255, 0.12);
            backdrop-filter: blur(24px);
            text-align: center;
            position: relative;
        }

        .badge-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.35);
            border-radius: 999px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-teal);
            margin-bottom: 20px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 60%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 24px;
        }

        /* Mascot Stage */
        .stage {
            position: relative;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0 35px;
        }

        /* Speech Bubble */
        .speech-bubble {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-teal);
            border-radius: 18px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.28);
            margin-bottom: 20px;
            position: relative;
            max-width: 420px;
            animation: bubbleFloat 3s ease-in-out infinite;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 9px 9px 0 9px;
            border-style: solid;
            border-color: var(--accent-teal) transparent transparent transparent;
            transition: border-color 0.3s ease;
        }

        .speech-bubble.mood-angry {
            border-color: #ef4444;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.35);
        }
        .speech-bubble.mood-angry::after {
            border-color: #ef4444 transparent transparent transparent;
        }

        .speech-bubble.mood-happy {
            border-color: #ff6090;
            box-shadow: 0 10px 30px rgba(255, 96, 144, 0.35);
        }
        .speech-bubble.mood-happy::after {
            border-color: #ff6090 transparent transparent transparent;
        }

        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* MASCOT CSS */
        .assist-mascot {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            user-select: none;
            animation: mascotFloat 3s ease-in-out infinite;
            transform-origin: center;
            outline: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .assist-mascot:hover {
            transform: scale(1.1);
        }

        .assist-mascot svg {
            overflow: visible;
            display: block;
        }

        @keyframes mascotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .mascot-body {
            transform-origin: 100px 140px;
            animation: bodyBreathing 2.5s ease-in-out infinite;
        }

        @keyframes bodyBreathing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        .eye {
            transform-box: fill-box;
            transform-origin: center;
            animation: blink 5s infinite;
        }

        @keyframes blink {
            0%, 92%, 96%, 100% { transform: scaleY(1); }
            94% { transform: scaleY(0.08); }
        }

        .mascot-orb {
            transform-origin: 100px 30px;
            animation: orbPulse 2s ease-in-out infinite;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .orb-ring {
            transform-origin: 100px 30px;
            animation: orbRing 3s linear infinite;
        }

        @keyframes orbRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .left-hand {
            transform-origin: 30px 155px;
            animation: leftHandIdle 2.5s ease-in-out infinite;
        }

        .right-hand {
            transform-origin: 170px 155px;
            animation: rightHandIdle 2.5s ease-in-out infinite;
        }

        @keyframes leftHandIdle {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(6deg); }
        }

        @keyframes rightHandIdle {
            0%, 100% { transform: rotate(4deg); }
            50% { transform: rotate(-6deg); }
        }

        .ground-shadow {
            transform-origin: center;
            animation: shadowAnimation 3s ease-in-out infinite;
        }

        @keyframes shadowAnimation {
            0%, 100% { transform: scaleX(1); opacity: 0.14; }
            50% { transform: scaleX(0.82); opacity: 0.08; }
        }

        /* HELLO */
        .mascot-hello .right-hand {
            animation: wave 0.5s ease-in-out infinite alternate;
        }

        @keyframes wave {
            from { transform: rotate(-5deg); }
            to { transform: rotate(-35deg) translateY(-6px); }
        }

        /* THINKING */
        .mascot-thinking .mascot-orb {
            animation: thinkingOrb 0.65s ease-in-out infinite alternate;
        }

        .mascot-thinking .orb-ring {
            animation: orbRing 0.6s linear infinite;
        }

        @keyframes thinkingOrb {
            from { transform: scale(1); }
            to { transform: scale(1.22); }
        }

        .thinking-dots circle {
            transform-box: fill-box;
            transform-origin: center;
            animation: thinkingDot 1.2s ease-in-out infinite;
        }

        .thinking-dots circle:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots circle:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinkingDot {
            0%, 100% { opacity: 0.25; transform: translateY(4px); }
            50% { opacity: 1; transform: translateY(-4px); }
        }

        /* SUCCESS */
        .mascot-success {
            animation: successBounce 0.7s ease-out;
        }

        @keyframes successBounce {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-20px) scale(1.08); }
            70% { transform: translateY(3px) scale(0.98); }
            100% { transform: translateY(0) scale(1); }
        }

        .success-stars {
            animation: starPop 0.7s ease-out;
            transform-origin: 155px 70px;
        }

        @keyframes starPop {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }

        /* WARNING */
        .mascot-warning {
            animation: warningShake 0.45s ease-in-out;
        }

        .mascot-warning .mascot-orb {
            filter: hue-rotate(130deg);
        }

        @keyframes warningShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
        }

        /* HAPPY */
        .mascot-happy {
            animation: happyJump 0.8s ease-out;
        }

        @keyframes happyJump {
            0% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-18px) scale(1.08); }
            50% { transform: translateY(-10px) scale(1.12); }
            75% { transform: translateY(2px) scale(0.98); }
            100% { transform: translateY(0) scale(1); }
        }

        .mascot-happy .left-hand {
            animation: happyLeftHand 0.45s ease-in-out infinite alternate;
        }

        @keyframes happyLeftHand {
            from { transform: rotate(-5deg); }
            to { transform: rotate(25deg) translateY(-8px); }
        }

        .mascot-happy .right-hand {
            animation: happyRightHand 0.45s ease-in-out infinite alternate;
        }

        @keyframes happyRightHand {
            from { transform: rotate(5deg); }
            to { transform: rotate(-25deg) translateY(-8px); }
        }

        .happy-eyes {
            transform-origin: 100px 125px;
            animation: happyEyes 0.5s ease-out;
        }

        @keyframes happyEyes {
            from { transform: scaleY(0.3); opacity: 0; }
            to { transform: scaleY(1); opacity: 1; }
        }

        .happy-mouth {
            transform-origin: 100px 155px;
            animation: happySmile 0.5s ease-out;
        }

        @keyframes happySmile {
            0% { transform: scale(0.5); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .mascot-happy .mascot-orb {
            animation: happyOrb 0.35s ease-in-out infinite alternate;
        }

        @keyframes happyOrb {
            from { transform: scale(1); }
            to { transform: scale(1.28); }
        }

        .mascot-happy .orb-ring {
            animation: orbRing 0.4s linear infinite;
        }

        .happy-effects {
            transform-origin: center;
            animation: happyParticles 0.9s ease-out;
        }

        @keyframes happyParticles {
            0% { opacity: 0; transform: scale(0.3); }
            40% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0; transform: translateY(-12px) scale(1); }
        }

        /* ANGRY */
        .mascot-angry {
            animation: angryShake 0.12s linear infinite alternate;
        }

        @keyframes angryShake {
            from { transform: translateX(-4px) rotate(-1deg); }
            to { transform: translateX(4px) rotate(1deg); }
        }

        .mascot-angry .mascot-orb {
            filter: hue-rotate(145deg) saturate(2.2);
            animation: angryOrb 0.22s ease-in-out infinite alternate;
        }

        @keyframes angryOrb {
            from { transform: scale(1.05); }
            to { transform: scale(1.28); }
        }

        .mascot-angry .orb-ring {
            stroke: #ff626d;
            animation: orbRing 0.3s linear infinite;
        }

        .mascot-angry .left-hand {
            animation: angryLeftHand 0.18s ease-in-out infinite alternate;
        }

        .mascot-angry .right-hand {
            animation: angryRightHand 0.18s ease-in-out infinite alternate;
        }

        @keyframes angryLeftHand {
            from { transform: rotate(8deg) translateY(0); }
            to { transform: rotate(-18deg) translateY(-5px); }
        }

        @keyframes angryRightHand {
            from { transform: rotate(-8deg) translateY(0); }
            to { transform: rotate(18deg) translateY(-5px); }
        }

        .angry-eyes {
            transform-origin: 100px 125px;
            animation: angryEyePop 0.22s ease-out;
        }

        @keyframes angryEyePop {
            from { opacity: 0; transform: scaleY(0.4); }
            to { opacity: 1; transform: scaleY(1); }
        }

        .angry-mouth {
            transform-origin: 100px 158px;
            animation: angryMouth 0.22s ease-out;
        }

        @keyframes angryMouth {
            from { transform: scale(0.6); }
            to { transform: scale(1); }
        }

        .angry-effects {
            transform-origin: center;
            animation: angryEffects 0.35s ease-in-out infinite alternate;
        }

        @keyframes angryEffects {
            from { opacity: 0.65; transform: scale(0.9) rotate(-4deg); }
            to { opacity: 1; transform: scale(1.08) rotate(4deg); }
        }

        /* Controls Panel */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
        }

        .btn-state {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-state:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: var(--accent-teal);
            transform: translateY(-2px);
        }

        .btn-state.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.35), rgba(192, 132, 252, 0.35));
            border-color: var(--accent-teal);
            color: #fff;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.35);
        }

        .btn-state.btn-happy.active {
            background: linear-gradient(135deg, rgba(255, 96, 144, 0.4), rgba(255, 182, 193, 0.4));
            border-color: var(--accent-pink);
            box-shadow: 0 0 16px rgba(255, 96, 144, 0.4);
        }

        .btn-state.btn-angry.active {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.45), rgba(220, 38, 38, 0.45));
            border-color: var(--accent-red);
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <div class="badge-header">
            <i class="fa-solid fa-sparkles"></i> Pure Mascot View
        </div>
        <h1>Assist Mascot Interactive Showcase</h1>
        <p class="desc">Featuring all 7 animated expressions: <strong>Happy, Angry, Idle, Hello, Thinking, Success &amp; Warning</strong></p>

        <div class="stage">
            <div class="speech-bubble" id="speechText">
                ✨ "Click any expression button below or click directly on Mochi to test all animations!"
            </div>

            <button type="button" class="assist-mascot mascot-happy" id="mascotBtn" style="width: 170px; height: 170px;" onclick="cycleState()">
                <svg viewBox="0 0 200 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" id="mascotSvgRoot">
                    <!-- Injected dynamically by renderMascotSvg() -->
                </svg>
            </button>
        </div>

        <div class="controls">
            <button class="btn-state btn-happy active" onclick="setState('happy')"><i class="fa-solid fa-face-laugh-beam" style="color:#ff6090"></i> Happy ✨</button>
            <button class="btn-state btn-angry" onclick="setState('angry')"><i class="fa-solid fa-face-angry" style="color:#ef4444"></i> Angry 💢</button>
            <button class="btn-state" onclick="setState('idle')"><i class="fa-solid fa-moon"></i> Idle</button>
            <button class="btn-state" onclick="setState('hello')"><i class="fa-solid fa-hand"></i> Hello (Wave)</button>
            <button class="btn-state" onclick="setState('thinking')"><i class="fa-solid fa-gear fa-spin"></i> Thinking</button>
            <button class="btn-state" onclick="setState('success')"><i class="fa-solid fa-circle-check" style="color:#34d399"></i> Success</button>
            <button class="btn-state" onclick="setState('warning')"><i class="fa-solid fa-triangle-exclamation" style="color:#fbbf24"></i> Warning</button>
        </div>
    </div>

    <script>
        const states = ['happy', 'angry', 'idle', 'hello', 'thinking', 'success', 'warning'];
        let currentStateIndex = 0;

        const speechMap = {
            'happy': '💖 "Yay! Everything compiled perfectly and all tests are passing with zero errors! ( ^ _ ^ )"',
            'angry': '💢 "Grrr! Who deleted the target database index without running pre-flight backup?! Ò_Ó"',
            'idle': '✨ "Standing by! Ready to guide you through your GCP cloud operations!"',
            'hello': '👋 "Hi there! I am Mochi, your GCP Infrastructure Assistant!"',
            'thinking': '⚡ "Inspecting schema definitions and streaming Datastore properties..."',
            'success': '🎉 "Woohoo! Operation completed and audited with 1-click revert protection!"',
            'warning': '⚠️ "Hold on! Double-check permissions before committing live writes!"'
        };

        function getSvgMarkup(state) {
            const cheekFill = state === 'angry' ? '#ff5b67' : '#ff9cac';
            const cheekOpacity = state === 'happy' ? '0.72' : state === 'angry' ? '0.58' : '0.35';

            let eyesMarkup = `
                <g class="eyes">
                    <ellipse class="eye" cx="78" cy="124" rx="10" ry="17" fill="#16172b" />
                    <ellipse class="eye" cx="122" cy="124" rx="10" ry="17" fill="#16172b" />
                    <circle cx="74" cy="118" r="3.5" fill="white" />
                    <circle cx="118" cy="118" r="3.5" fill="white" />
                    <circle cx="80" cy="133" r="2.5" fill="#665cff" />
                    <circle cx="124" cy="133" r="2.5" fill="#665cff" />
                </g>
            `;
            if (state === 'happy') {
                eyesMarkup = `
                    <g class="happy-eyes">
                        <path d="M68 126 Q78 116 88 126" fill="none" stroke="#16172b" stroke-width="5" stroke-linecap="round" />
                        <path d="M112 126 Q122 116 132 126" fill="none" stroke="#16172b" stroke-width="5" stroke-linecap="round" />
                    </g>
                `;
            } else if (state === 'angry') {
                eyesMarkup = `
                    <g class="angry-eyes">
                        <path d="M66 116 L89 124" fill="none" stroke="#32171b" stroke-width="5" stroke-linecap="round" />
                        <path d="M111 124 L134 116" fill="none" stroke="#32171b" stroke-width="5" stroke-linecap="round" />
                        <ellipse cx="78" cy="130" rx="8" ry="11" fill="#24151a" />
                        <ellipse cx="122" cy="130" rx="8" ry="11" fill="#24151a" />
                        <circle cx="76" cy="127" r="2.4" fill="#ff8a8a" />
                        <circle cx="120" cy="127" r="2.4" fill="#ff8a8a" />
                    </g>
                `;
            }

            let mouthMarkup = `
                <g class="mouth">
                    <path d="M89 145 Q100 155 111 145 Q110 165 100 166 Q90 164 89 145" fill="#4d1625" />
                    <ellipse cx="100" cy="158" rx="7" ry="4" fill="#ff8193" />
                </g>
            `;
            if (state === 'happy') {
                mouthMarkup = `
                    <g class="happy-mouth">
                        <path d="M84 145 Q100 170 116 145 Q114 172 100 174 Q86 171 84 145" fill="#54182b" />
                        <ellipse cx="100" cy="164" rx="9" ry="5" fill="#ff7f9d" />
                    </g>
                `;
            } else if (state === 'angry') {
                mouthMarkup = `
                    <g class="angry-mouth">
                        <path d="M88 164 Q100 150 112 164" fill="none" stroke="#5b1f27" stroke-width="5" stroke-linecap="round" />
                    </g>
                `;
            }

            let overlays = '';
            if (state === 'thinking') {
                overlays = `
                    <g class="thinking-dots">
                        <circle cx="147" cy="70" r="3" fill="#7066ff" />
                        <circle cx="157" cy="60" r="4" fill="#57dfff" />
                        <circle cx="169" cy="48" r="5" fill="#ab7aff" />
                    </g>
                `;
            } else if (state === 'success') {
                overlays = `
                    <g class="success-stars">
                        <text x="155" y="70" font-size="22">✨</text>
                    </g>
                `;
            } else if (state === 'happy') {
                overlays = `
                    <g class="happy-effects">
                        <text x="30" y="82" font-size="20">✨</text>
                        <text x="151" y="88" font-size="18">✨</text>
                        <text x="18" y="118" font-size="17">💖</text>
                        <text x="164" y="118" font-size="17">💖</text>
                    </g>
                `;
            } else if (state === 'angry') {
                overlays = `
                    <g class="angry-effects">
                        <text x="25" y="90" font-size="22">💢</text>
                        <text x="151" y="92" font-size="20">💢</text>
                    </g>
                `;
            }

            return `
                <defs>
                    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="65%" stop-color="#fffaf4" />
                        <stop offset="100%" stop-color="#e9e8ff" />
                    </linearGradient>

                    <radialGradient id="orbGrad">
                        <stop offset="0%" stop-color="#7ffcff" />
                        <stop offset="35%" stop-color="#4f9cff" />
                        <stop offset="70%" stop-color="#725cff" />
                        <stop offset="100%" stop-color="#be82ff" />
                    </radialGradient>

                    <linearGradient id="earGrad">
                        <stop offset="0%" stop-color="#56e7ff" />
                        <stop offset="100%" stop-color="#8c5cff" />
                    </linearGradient>

                    <filter id="orbGlow" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>

                    <filter id="shadow">
                        <feDropShadow dx="0" dy="8" stdDeviation="7" flood-opacity="0.16" />
                    </filter>
                </defs>

                <!-- ORB -->
                <g class="mascot-orb">
                    <circle cx="100" cy="30" r="19" fill="url(#orbGrad)" filter="url(#orbGlow)" />
                    <circle cx="94" cy="24" r="4" fill="white" opacity="0.85" />
                    <ellipse class="orb-ring" cx="100" cy="30" rx="31" ry="8" fill="none" stroke="#70eaff" stroke-width="2" />
                </g>

                <!-- ANTENNA -->
                <rect x="96" y="48" width="8" height="18" rx="4" fill="#d4d1ff" />

                <!-- BODY -->
                <g class="mascot-body" filter="url(#shadow)">
                    <path d="
                        M100 58
                        C58 58 35 85 35 126
                        C35 160 52 180 66 188
                        C74 205 87 199 94 195
                        C100 206 111 203 116 195
                        C128 203 140 197 142 187
                        C160 174 166 152 165 126
                        C165 84 141 58 100 58
                    " fill="url(#bodyGrad)" />

                    <!-- EARS -->
                    <g>
                        <ellipse cx="39" cy="128" rx="10" ry="23" fill="#f4f2ff" />
                        <ellipse cx="39" cy="128" rx="5" ry="16" fill="url(#earGrad)" />
                    </g>
                    <g>
                        <ellipse cx="161" cy="128" rx="10" ry="23" fill="#f4f2ff" />
                        <ellipse cx="161" cy="128" rx="5" ry="16" fill="url(#earGrad)" />
                    </g>

                    ${eyesMarkup}

                    <!-- CHEEKS -->
                    <ellipse class="cheek" cx="61" cy="145" rx="11" ry="6" fill="${cheekFill}" opacity="${cheekOpacity}" />
                    <ellipse class="cheek" cx="139" cy="145" rx="11" ry="6" fill="${cheekFill}" opacity="${cheekOpacity}" />

                    ${mouthMarkup}
                </g>

                <!-- HANDS -->
                <g class="left-hand">
                    <circle cx="27" cy="150" r="14" fill="url(#bodyGrad)" />
                    <circle cx="20" cy="143" r="7" fill="url(#bodyGrad)" />
                </g>
                <g class="right-hand">
                    <circle cx="173" cy="150" r="14" fill="url(#bodyGrad)" />
                    <circle cx="180" cy="143" r="7" fill="url(#bodyGrad)" />
                </g>

                <!-- SHADOW -->
                <ellipse class="ground-shadow" cx="100" cy="207" rx="42" ry="7" fill="#35325d" opacity="0.14" />

                ${overlays}
            `;
        }

        function setState(stateName) {
            const mascot = document.getElementById('mascotBtn');
            const svgRoot = document.getElementById('mascotSvgRoot');
            const speech = document.getElementById('speechText');

            mascot.className = `assist-mascot mascot-${stateName}`;
            svgRoot.innerHTML = getSvgMarkup(stateName);

            speech.className = `speech-bubble ${stateName === 'happy' ? 'mood-happy' : stateName === 'angry' ? 'mood-angry' : ''}`;
            speech.textContent = speechMap[stateName] || '';

            document.querySelectorAll('.btn-state').forEach(b => {
                const isMatch = b.textContent.toLowerCase().includes(stateName);
                b.classList.toggle('active', isMatch);
            });

            currentStateIndex = states.indexOf(stateName);
        }

        function cycleState() {
            currentStateIndex = (currentStateIndex + 1) % states.length;
            setState(states[currentStateIndex]);
        }

        // Initialize with Happy state
        setState('happy');
    </script>
</body>
</html>
